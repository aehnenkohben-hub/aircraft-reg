            };
            const eligible = eligibleAircraftOverride || window._randomReviewEligibleAircraft;
            const sourceRef = eligible ? eligible[index] : null;
            const dataIndex = sourceRef != null ? aircraftData.indexOf(sourceRef) : -1;
            const targetIndex = dataIndex >= 0 ? dataIndex : index;
            aircraftData[targetIndex] = aircraft;
            if (eligible && eligible[index] !== undefined) {
                eligible[index] = aircraft;
            }
            saveAircraftData();
        }
        // Helper functions for random review form (addHistoryItem, addTripItem, addSightingItem)
        function addHistoryItemRandom(registration, operator, isCurrent, isSeen, wrapper) {
            const historyItemsContainer = wrapper.querySelector('#historyItemsContainer_random');
            const isInService = wrapper.querySelector('#inService_random').checked;
            const buttonText = isInService ? 'Current' : 'Last Known';
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item history-reg-row';
            historyItem.innerHTML = `
                <div class="history-reg-row-fields">
                    <input type="text" class="history-reg reg-format" placeholder="Registration" value="${registration}" required>
                    <input type="text" class="history-operator" placeholder="Operator (auto-filled)" value="${operator}">
                    <button type="button" class="button secondary lookup-reg-btn">Look up</button>
                    <button type="button" class="button secondary undo-lookup-btn hidden">Undo</button>
                    <div class="history-actions">
                        <button type="button" class="button ${isInService ? 'current-reg-btn' : 'last-known-btn'} set-current-btn">${buttonText}</button>
                        <button type="button" class="button seen set-seen-btn">Seen</button>
                        <button type="button" class="button delete remove-history-btn">×</button>
                    </div>
                </div>
                <div class="history-reg-lookup-status reg-lookup-status hidden" aria-live="polite"></div>
                <div class="history-lookup-match-row hidden">
                    <label>Choose operator / type from lookup:</label>
                    <select class="history-lookup-match-picker"></select>
                </div>
                <input type="checkbox" class="current-reg-checkbox hidden" ${isCurrent ? 'checked' : ''}>
                <input type="checkbox" class="seen-checkbox hidden" ${isSeen ? 'checked' : ''}>
            `;
            historyItemsContainer.appendChild(historyItem);
            const regInputElRandom = historyItem.querySelector('.history-reg');
            regInputElRandom.addEventListener('input', function() {
                this.value = this.value.toUpperCase();
                clearLookupUndo(historyItem);
                hideRowLookupMatch(historyItem);
            });
            attachRegistrationDuplicateCheck(regInputElRandom, wrapper);
            const lookupContext = createRandomReviewLookupContext(wrapper);
            attachRowLookupMatchPicker(historyItem, lookupContext);
            historyItem.querySelector('.lookup-reg-btn').addEventListener('click', (e) => {
                e.preventDefault();
                const regInput = historyItem.querySelector('.history-reg');
                if (regInput) runRegistrationLookup(regInput, historyItem, lookupContext);
            });
            historyItem.querySelector('.undo-lookup-btn').addEventListener('click', (e) => {
                e.preventDefault();
                undoRegistrationLookup(historyItem, lookupContext);
            });
            historyItem.querySelector('.remove-history-btn').addEventListener('click', () => {
                if (wrapper.querySelectorAll('#historyItemsContainer_random .history-reg-row').length > 1) {
                    historyItem.remove();
                } else {
                    alert("You must have at least one registration.");
                }
            });
            historyItem.querySelector('.set-current-btn').addEventListener('click', function() {
                wrapper.querySelectorAll('.current-reg-checkbox').forEach(cb => {
                    cb.checked = false;
                });
                historyItem.querySelector('.current-reg-checkbox').checked = true;
                wrapper.querySelectorAll('.set-current-btn').forEach(btn => {
                    const isService = wrapper.querySelector('#inService_random').checked;
                    btn.textContent = isService ? 'Current' : 'Last Known';
                    btn.style.backgroundColor = '#5856d6';
                });
                this.textContent = `✓ ${buttonText}`;
                this.style.backgroundColor = '#34c759';

                const regInput = historyItem.querySelector('.history-reg');
                if (regInput && regInput.value.trim().length >= 3) {
                    runRegistrationLookup(regInput, historyItem, lookupContext);
                }
            });
            historyItem.querySelector('.set-seen-btn').addEventListener('click', function() {
                const seenCheckbox = historyItem.querySelector('.seen-checkbox');
                seenCheckbox.checked = !seenCheckbox.checked;
                if (seenCheckbox.checked) {
                    this.style.backgroundColor = '#5ac8fa';
                    this.textContent = '✓ Seen';
                    syncSightingsSection(wrapper, true);
                } else {
                    this.style.backgroundColor = '#5ac8fa';
                    this.textContent = 'Seen';
                    syncSightingsSection(wrapper);
                }
            });
            if (isCurrent) {
                historyItem.querySelector('.set-current-btn').textContent = `✓ ${buttonText}`;
                historyItem.querySelector('.set-current-btn').style.backgroundColor = '#34c759';
            }
            historyItem.querySelector('.set-seen-btn').style.backgroundColor = '#5ac8fa';
            historyItem.querySelector('.set-seen-btn').textContent = isSeen ? '✓ Seen' : 'Seen';
        }
        function addTripItemRandom(departure, arrival, date, isFirst, wrapper) {
            const tripsContainer = wrapper.querySelector('#tripsContainer_random');
            const tripItem = document.createElement('div');
            tripItem.className = 'history-item';
            tripItem.innerHTML = `
                <input type="text" class="trip-departure reg-format" maxlength="3" placeholder="Departure (IATA)" value="${departure}">
                <input type="text" class="trip-arrival reg-format" maxlength="3" placeholder="Arrival (IATA)" value="${arrival}">
                <input type="date" class="trip-date" value="${date}">
                <div class="history-actions">
                    <button type="button" class="button delete remove-trip-btn">×</button>
                </div>
            `;
            tripsContainer.appendChild(tripItem);
            tripItem.querySelector('.trip-departure').addEventListener('input', function() {
                this.value = this.value.toUpperCase();
            });
            tripItem.querySelector('.trip-arrival').addEventListener('input', function() {
                this.value = this.value.toUpperCase();
            });
            tripItem.querySelector('.remove-trip-btn').addEventListener('click', () => {
                if (wrapper.querySelectorAll('#tripsContainer_random .history-item').length > 1 || !isFirst) {
                    tripItem.remove();
                } else {
                    alert("You must have at least one trip if you have flown.");
                }
            });
        }
        function addSightingItemRandom(location, date, isFirst, wrapper) {
            const sightingDate = date || todayDateInputValue();
            const sightingsContainer = wrapper.querySelector('#sightingsContainer_random');
            const sightingItem = document.createElement('div');
            sightingItem.className = 'history-item';
            sightingItem.innerHTML = `
                <input type="text" class="sighting-location reg-format" maxlength="3" placeholder="Location (IATA)" value="${location}">
                <input type="date" class="sighting-date" value="${sightingDate}">
                <div class="history-actions">
                    <button type="button" class="button delete remove-sighting-btn">×</button>
                </div>
            `;
            sightingsContainer.appendChild(sightingItem);
            sightingItem.querySelector('.sighting-location').addEventListener('input', function() {
                this.value = this.value.toUpperCase();
            });
            sightingItem.querySelector('.remove-sighting-btn').addEventListener('click', () => {
                sightingItem.remove();
            });
        }
        
        // Add the missing attachRandomReviewEventListeners function
        function attachRandomReviewEventListeners(wrapper) {
            // Out of service toggle
            const inServiceCheckbox = wrapper.querySelector('#inService_random');
            const outOfServiceSection = wrapper.querySelector('#outOfServiceSection_random');
            if (inServiceCheckbox && outOfServiceSection) {
                inServiceCheckbox.addEventListener('change', function() {
                    outOfServiceSection.classList.toggle('hidden', inServiceCheckbox.checked);
                });
                // Ensure correct initial state
                outOfServiceSection.classList.toggle('hidden', inServiceCheckbox.checked);
            }
            // Out of service radio buttons
            const statusStored = wrapper.querySelector('#statusStored_random');
            const statusScrapped = wrapper.querySelector('#statusScrapped_random');
            const statusWrittenOff = wrapper.querySelector('#statusWrittenOff_random');
            const statusCrashed = wrapper.querySelector('#statusCrashed_random');
            const statusOther = wrapper.querySelector('#statusOther_random');
            const otherStatusSection = wrapper.querySelector('#otherStatusSection_random');
            if (statusStored && otherStatusSection) {
                statusStored.addEventListener('change', function() {
                    if (this.checked) otherStatusSection.classList.add('hidden');
                });
            }
            if (statusScrapped && otherStatusSection) {
                statusScrapped.addEventListener('change', function() {
                    if (this.checked) otherStatusSection.classList.add('hidden');
                });
            }
            if (statusWrittenOff && otherStatusSection) {
                statusWrittenOff.addEventListener('change', function() {
                    if (this.checked) otherStatusSection.classList.add('hidden');
                });
            }
            if (statusCrashed && otherStatusSection) {
                statusCrashed.addEventListener('change', function() {
                    if (this.checked) otherStatusSection.classList.add('hidden');
                });
            }
            if (statusOther && otherStatusSection) {
                statusOther.addEventListener('change', function() {
                    if (this.checked) otherStatusSection.classList.remove('hidden');
                });
            }
            // Flown toggle
            const flownCheckbox = wrapper.querySelector('#flown_random');
            const flightDetails = wrapper.querySelector('#flightDetails_random');
            if (flownCheckbox && flightDetails) {
                flownCheckbox.addEventListener('change', function() {
                    flightDetails.classList.toggle('hidden', !flownCheckbox.checked);
                });
            }
            // Add history, trip, sighting buttons
            const addHistoryBtn = wrapper.querySelector('#addHistoryBtn_random');
            const historyItemsContainer = wrapper.querySelector('#historyItemsContainer_random');
            if (addHistoryBtn && historyItemsContainer) {
                addHistoryBtn.addEventListener('click', function() {
                    addHistoryItemRandom('', '', false, false, wrapper);
                });
            }
            const lookupCtx = createRandomReviewLookupContext(wrapper);
            const lookupResultPicker = wrapper.querySelector('#lookupResultPicker_random');
            if (lookupResultPicker) {
                lookupResultPicker.addEventListener('change', () => {
                    applySelectedLookupResult(lookupCtx);
                });
            }
            const addTripBtn = wrapper.querySelector('#addTripBtn_random');
            const tripsContainer = wrapper.querySelector('#tripsContainer_random');
            if (addTripBtn && tripsContainer) {
                addTripBtn.addEventListener('click', function() {
                    addTripItemRandom('', '', '', false, wrapper);
                });
            }
            const addSightingBtn = wrapper.querySelector('#addSightingBtn_random');
            const sightingsContainer = wrapper.querySelector('#sightingsContainer_random');
            if (addSightingBtn && sightingsContainer) {
                addSightingBtn.addEventListener('click', function() {
                    addSightingItemRandom('', '', false, wrapper);
                });
            }
            // Uppercase formatting for relevant inputs
            wrapper.querySelectorAll('.reg-format').forEach(input => {
                input.addEventListener('input', function() { this.value = this.value.toUpperCase(); });
            });
        }
        
        // ========== INITIALIZE APP ==========
        init();

        // --- Airline normalization helper ---
        function normalizeAirlineName(name) {
            if (!name) return '';
            let n = name.trim().toLowerCase();
            if (n === 'tap air portugal' || n === 'tap - air portugal' || n === 'tap portugal') return 'tap air portugal';
            if (n === 'tuifly' || n === 'tui fly' || n === 'tui') return 'tuifly';
            if (n === 'sky airline' || n === 'sky airlines') return 'sky airline';
            return n;
        }
    </script>

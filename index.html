<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. META SECTION -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Aircraft Logger</title>
    
    <!-- 2. CSS SECTION -->
    <style>
        :root {
            --bg: #e8e4dc;
            --surface: #faf8f5;
            --surface-elevated: #ffffff;
            --surface-muted: #f0ece6;
            --text: #1f1f1f;
            --text-secondary: #5c5c5c;
            --text-muted: #888880;
            --primary: #2a3542;
            --primary-hover: #1a2229;
            --accent: #4a6274;
            --link: #3d5a73;
            --border: #d4cfc6;
            --border-strong: #b8b2a8;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 12px;
            --font-mono: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Consolas, monospace;
            --success: #2d5a3d;
            --danger: #8b2e2e;
            --warning: #7a5c1e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            max-width: 640px;
            margin: 0 auto;
            padding: 32px 18px 56px;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            font-size: 0.9375rem;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        h1 {
            color: var(--text);
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        h2 {
            font-size: 1.375rem;
            font-weight: 600;
            color: var(--text);
            margin: 0 0 0.35rem;
            letter-spacing: -0.02em;
        }

        .page-header {
            margin-bottom: 1.35rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .page-header h2 {
            margin-bottom: 0.25rem;
        }

        .page-subtitle {
            margin: 0;
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .view-panel {
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.35rem 1.25rem 1.5rem;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .toolbar .button {
            margin: 0;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem 1rem;
            padding: 0.75rem 0;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .filter-bar label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0;
            font-weight: 400;
            font-size: 0.875rem;
            color: var(--text-secondary);
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-bar label input[type="radio"],
        .filter-bar label input[type="checkbox"] {
            width: 1.125rem;
            height: 1.125rem;
            min-width: 1.125rem;
            flex: 0 0 auto;
            margin: 0;
            padding: 0;
            accent-color: var(--primary);
        }

        .filter-bar select {
            width: auto;
            min-width: 10rem;
            margin-bottom: 0;
            padding: 0.5rem 0.65rem;
            font-size: 0.875rem;
        }

        .search-input {
            flex: 1 1 12rem;
            min-width: 10rem;
            margin: 0 !important;
            padding: 0.5rem 0.75rem;
            font-size: 0.9375rem;
        }

        .search-scope-group {
            display: flex;
            flex: 1 1 100%;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem 0.85rem;
            row-gap: 0.65rem;
        }

        .search-scope-group .search-scope-title {
            flex: 0 0 100%;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        @media (min-width: 480px) {
            .search-scope-group .search-scope-title {
                flex: 0 0 auto;
            }
        }

        .button {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: var(--primary);
            color: #f8f8f6;
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.8125rem;
            margin: 0;
            border: 1px solid var(--primary);
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .button:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .button.secondary {
            background-color: var(--surface);
            color: var(--text);
            border-color: var(--border-strong);
        }

        .button.secondary:hover {
            background-color: var(--surface-muted);
        }

        .button.tertiary {
            background-color: transparent;
            color: var(--text-secondary);
            border-color: var(--border);
            font-weight: 500;
        }

        .button.tertiary:hover {
            background-color: var(--surface-muted);
            color: var(--text);
        }

        .button.edit,
        .button.delete,
        .button.details {
            background-color: var(--surface-elevated);
            color: var(--text-secondary);
            border-color: var(--border-strong);
            font-weight: 500;
        }

        .button.edit:hover,
        .button.details:hover {
            background-color: var(--surface-muted);
            color: var(--text);
        }

        .button.delete:hover {
            background-color: var(--surface-muted);
            color: var(--danger);
        }

        .button.seen {
            background-color: var(--surface);
            color: #0369a1;
            border-color: #bae6fd;
        }

        .button.seen:hover {
            background-color: #f0f9ff;
        }

        .button.inactive {
            background-color: var(--surface);
            color: var(--warning);
            border-color: #fed7aa;
        }

        .button.inactive:hover {
            background-color: #fffbeb;
        }

        .button.export,
        .button.import {
            background-color: var(--surface);
            color: var(--text);
            border-color: var(--border-strong);
        }

        .button.random-review {
            background-color: var(--surface-elevated);
            color: var(--text);
            border-color: var(--border-strong);
            font-weight: 500;
        }

        .button.random-review:hover {
            background-color: var(--surface-muted);
        }

        .aircraft-actions .button,
        .history-actions .button {
            padding: 0.4rem 0.75rem;
            font-size: 0.8125rem;
            font-weight: 600;
        }

        .history-actions .button.delete {
            min-width: 2rem;
            padding: 0.4rem 0.55rem;
        }

        form {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
            margin-top: 1rem;
            box-shadow: none;
        }

        #logForm.view-panel form {
            margin-top: 0.75rem;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text);
        }

        input, select, textarea {
            width: 100%;
            padding: 0.625rem 0.75rem;
            margin-bottom: 15px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            box-sizing: border-box;
            font-size: 0.9375rem;
            background: var(--surface);
            color: var(--text);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:hover,
        select:hover,
        textarea:hover {
            border-color: #b0bcc9;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 68, 114, 0.12);
            outline: none;
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--text-muted);
        }
        textarea {
            min-height: 80px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            padding: 0.65rem 0.75rem;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .checkbox-container label {
            margin-bottom: 0;
            font-weight: 500;
            cursor: pointer;
        }

        .checkbox-container input {
            width: auto;
            margin-right: 10px;
            margin-bottom: 0;
        }
        .radio-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .radio-container input {
            width: auto;
            margin-right: 10px;
        }
        .hidden {
            display: none;
        }
        #aircraftList,
        #inactiveAircraftList,
        #randomReviewPage {
            margin-top: 1.5rem;
        }

        .aircraft-item {
            display: grid;
            grid-template-columns: 64px 1fr;
            column-gap: 1rem;
            align-items: start;
            background-color: var(--surface);
            padding: 1rem 1.05rem;
            border-radius: var(--radius-md);
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
        }

        .aircraft-item > :not(.airline-logo-box) {
            grid-column: 2;
        }

        .aircraft-item .airline-logo-box {
            grid-column: 1;
            grid-row: 1 / span 20;
            position: static;
            top: unset;
            left: unset;
            transform: none;
            width: 64px;
            height: 64px;
            margin: 0;
            border-radius: var(--radius-sm);
        }

        .aircraft-card-main {
            min-width: 0;
        }

        .aircraft-reg-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.45rem 0.6rem;
            margin-bottom: 0.2rem;
        }

        .aircraft-reg {
            font-family: var(--font-mono);
            font-size: 1.0625rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
        }

        .aircraft-reg:hover {
            color: var(--accent);
        }

        .flown-indicator {
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 0.12rem 0.45rem;
            border: 1px solid var(--border-strong);
            border-radius: 4px;
            line-height: 1.2;
        }

        .summary-trip-list li {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.75rem;
        }

        .summary-trip-route {
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .summary-trip-date {
            font-size: 0.8125rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .aircraft-summary {
            margin: 0.65rem 0 0;
            padding: 0.65rem 0 0;
            border-top: 1px solid var(--border);
        }

        .summary-row {
            display: grid;
            grid-template-columns: 6.75rem 1fr;
            gap: 0.25rem 0.85rem;
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
            line-height: 1.45;
        }

        .summary-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .summary-row dt {
            margin: 0;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .summary-row dd {
            margin: 0;
            color: var(--text);
        }

        .summary-row dd a {
            color: var(--link);
            font-weight: 500;
            text-decoration: none;
        }

        .summary-row dd a:hover {
            text-decoration: underline;
        }

        .summary-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .summary-list li {
            padding: 0.2rem 0;
            font-size: 0.875rem;
        }

        .summary-list li + li {
            border-top: 1px dotted var(--border);
            margin-top: 0.2rem;
            padding-top: 0.3rem;
        }

        .summary-reg,
        a.summary-reg {
            font-family: var(--font-mono);
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--link);
            text-decoration: none;
        }

        a.summary-reg:hover {
            text-decoration: underline;
        }

        .summary-seen-sep {
            margin: 0 0.35rem;
            color: var(--text-muted);
        }

        .summary-airline,
        a.summary-airline {
            color: var(--text-secondary);
            font-weight: 500;
            text-decoration: none;
        }

        a.summary-airline:hover {
            color: var(--link);
            text-decoration: underline;
        }

        .detail-list-regs .detail-meta a {
            font-family: inherit;
            font-weight: 500;
            letter-spacing: normal;
        }

        .detail-list-links a {
            font-family: inherit;
            font-weight: 500;
            letter-spacing: normal;
        }

        .aircraft-actions {
            display: flex;
            gap: 0.35rem;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .aircraft-details {
            margin-top: 0.85rem;
            padding: 1rem;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .detail-section + .detail-section {
            margin-top: 1rem;
            padding-top: 0.85rem;
            border-top: 1px solid var(--border);
        }

        .detail-section-title {
            margin: 0 0 0.55rem;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text);
        }

        .detail-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .detail-list > li {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: baseline;
            gap: 0.5rem 1rem;
            padding: 0.45rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }

        .detail-list > li:last-child {
            border-bottom: none;
        }

        .detail-list-regs > li {
            grid-template-columns: minmax(5rem, auto) 1fr auto;
        }

        .detail-list-regs .detail-meta {
            text-align: left;
            white-space: normal;
        }

        .detail-list-links > li {
            grid-template-columns: 1fr;
        }

        .detail-list a {
            color: var(--link);
            font-family: var(--font-mono);
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.03em;
        }

        .detail-role {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: right;
            white-space: nowrap;
        }

        .detail-list a:hover {
            text-decoration: underline;
        }

        .detail-primary {
            font-weight: 500;
            color: var(--text);
        }

        .detail-status-text {
            margin: 0;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .detail-meta {
            font-size: 0.8125rem;
            color: var(--text-muted);
            text-align: right;
            white-space: nowrap;
        }

        .reg-tags {
            display: inline-flex;
            gap: 0.25rem;
            margin-left: auto;
        }

        .reg-tag {
            font-size: 0.625rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
        }

        .reg-tag-current {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .reg-tag-seen {
            background: #f0f9ff;
            color: #0369a1;
        }

        .list-group-heading {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin: 1.5rem 0 0.5rem;
        }

        .list-group-heading:first-child {
            margin-top: 0;
        }

        #inactiveAircraftEntries h4 {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 0.75rem 0 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-style: italic;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .history-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .history-item input {
            flex: 1;
            margin-bottom: 0;
        }
        .history-reg-row {
            flex-direction: column;
            align-items: stretch;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .history-reg-row:last-child {
            border-bottom: none;
        }
        .history-reg-row-fields {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .history-reg-row-fields .history-reg,
        .history-reg-row-fields .history-operator {
            flex: 1;
            min-width: 100px;
        }
        .lookup-reg-btn,
        .undo-lookup-btn {
            flex: 0 0 auto;
            padding: 8px 12px;
            font-size: 0.85em;
            margin: 0;
        }
        .undo-lookup-btn.hidden {
            display: none;
        }
        .history-reg-lookup-status {
            font-size: 0.85em;
            margin: 0;
        }
        .history-actions {
            display: flex;
            gap: 5px;
        }
        .history-container {
            margin-bottom: 1.25rem;
            padding: 1rem 1.125rem;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
        }

        .history-title {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-muted);
            margin-bottom: 0.65rem;
        }

        .reg-lookup-hint {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            margin: 0 0 0.75rem 0;
            line-height: 1.45;
        }
        .reg-lookup-status {
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .reg-lookup-status.loading { color: var(--primary); }
        .reg-lookup-status.success { color: var(--success); }
        .reg-lookup-status.error { color: var(--danger); }
        .reg-lookup-status.hidden { display: none; }
        .lookup-picker-section {
            margin-bottom: 15px;
        }
        .lookup-picker-section.hidden {
            display: none;
        }
        .history-lookup-match-row {
            margin: 6px 0 4px 0;
            max-width: 100%;
        }
        .history-lookup-match-row.hidden {
            display: none;
        }
        .history-lookup-match-row label {
            display: block;
            font-size: 0.85em;
            color: #666;
            margin-bottom: 4px;
        }
        .history-lookup-match-row select {
            width: 100%;
            max-width: 520px;
            padding: 8px;
            font-size: 0.95em;
        }
        .reg-format {
            text-transform: uppercase;
        }
        .current-reg-btn,
        .last-known-btn {
            background-color: var(--surface-elevated);
            color: var(--text);
            border-color: var(--border-strong);
            padding: 0.35rem 0.65rem;
            font-size: 0.75rem;
        }

        .current-reg-btn:hover,
        .last-known-btn:hover {
            background-color: var(--surface-muted);
        }

        .current-reg {
            font-weight: 600;
            color: var(--text);
        }

        .seen-reg {
            color: var(--text-secondary);
        }
        .detail-item {
            margin-bottom: 8px;
        }
        .status-options {
            margin-left: 20px;
            margin-top: 10px;
        }
        .other-status-input {
            margin-top: 10px;
        }
        #landingPage {
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem 1.5rem 1.5rem;
            margin: 2.5rem auto 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            max-width: 380px;
        }

        #landingPage .app-badge {
            margin: 0 0 0.5rem;
            font-size: 0.8125rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-transform: none;
            color: var(--text-muted);
            text-align: center;
        }

        #landingPage h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 1.25rem;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .landing-tabs {
            display: flex;
            gap: 0;
            padding: 0;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .landing-tab {
            flex: 1;
            padding: 0.6rem 0.5rem;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            border-radius: 0;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .landing-tab:hover {
            color: var(--text);
        }

        .landing-tab.is-active {
            color: var(--text);
            border-bottom-color: var(--text);
            background: transparent;
            box-shadow: none;
        }

        .landing-tab:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .landing-tab-panel {
            flex-direction: column;
            gap: 0.5rem;
        }

        .landing-tab-panel:not(.hidden):not([hidden]) {
            display: flex;
        }

        .landing-tab-panel.hidden,
        .landing-tab-panel[hidden] {
            display: none;
        }

        .landing-panel-intro {
            margin: 0 0 0.75rem;
            font-size: 0.9375rem;
            color: var(--text-secondary);
            line-height: 1.55;
            text-align: center;
        }

        .landing-actions,
        .landing-utilities {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #landingPage .button {
            width: 100%;

        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');

        return `${day}/${month}/${year}`;

        function registrationLookupVariants(reg) {
            const r = reg.trim().toUpperCase();
            const variants = [r];
            const noHyphen = r.replace(/-/g, '');
            if (noHyphen !== r) variants.push(noHyphen);
            if (!r.includes('-') && /^[A-Z][A-Z0-9]{3,}$/.test(r)) {
                variants.push(`${r.slice(0, 1)}-${r.slice(1)}`);
            }
            return [...new Set(variants)];
        }

        function todayDateInputValue() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getLogFormSightingsUI(formRoot) {
            if (formRoot) {
                return {
                    section: formRoot.querySelector('#sightingsSection_random'),

                };

            return {

                container: sightingsContainer,
                historyContainer: historyItemsContainer
            };
        }

        function formHasSeenRegistration(formRoot) {
            const { historyContainer } = getLogFormSightingsUI(formRoot);
            if (!historyContainer) return false;
            return Array.from(historyContainer.querySelectorAll('.seen-checkbox')).some(cb => cb.checked);
        }

        function syncSightingsSection(formRoot = null, scrollIntoView = false) {
            const ui = getLogFormSightingsUI(formRoot);
            if (!ui.section || !ui.container) return;

            const seen = formHasSeenRegistration(formRoot);
            if (!seen) {
                ui.container.querySelectorAll('.history-item').forEach(item => {
                    const loc = item.querySelector('.sighting-location')?.value?.trim();
                    const date = item.querySelector('.sighting-date')?.value?.trim();
                    if (!loc && !date) item.remove();
                });
            }

            const hasRows = ui.container.querySelectorAll('.history-item').length > 0;
            const show = seen || hasRows;
            ui.section.classList.toggle('hidden', !show);
            if (seen && !ui.container.querySelector('.history-item')) {
                if (formRoot) addSightingItemRandom('', '', true, formRoot);
                else addSightingItem('', '', true);
            }
            if (scrollIntoView && seen) {
                ui.section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function setLookupStatus(statusEl, message, kind) {
            if (!statusEl) return;
            statusEl.textContent = message || '';
            statusEl.classList.remove('loading', 'success', 'error', 'hidden');
            if (!message) {
                statusEl.classList.add('hidden');
                return;
            }
            if (kind) statusEl.classList.add(kind);
        }

        function formatAircraftTypeFromRecord(record) {
            if (!record) return '';
            const manufacturer = (record.manufacturer || '').trim();
            const type = (record.type || '').trim();
            const icao = (record.icao_type || '').trim();
            if (type) {
                if (manufacturer) {
                    const mfgToken = manufacturer.split(/\s+/)[0].toLowerCase();
                    if (!type.toLowerCase().includes(mfgToken)) {
                        return `${manufacturer} ${type}`.trim();
                    }
                }
                return type;
            }
            if (manufacturer && icao) return `${manufacturer} ${icao}`.trim();
            return icao || manufacturer || '';
        }

        function normalizeLookupRecord(raw, source) {
            const registration = (raw.registration || raw.Registration || '').toUpperCase();
            const operator = (raw.registered_owner || raw.RegisteredOwners || '').trim();
            const manufacturer = (raw.manufacturer || raw.Manufacturer || '').trim();
            const type = (raw.type || raw.Type || '').trim();
            const icao_type = (raw.icao_type || raw.ICAOTypeCode || '').trim();
            const record = { source, registration, operator, manufacturer, type, icao_type };
            record.displayType = formatAircraftTypeFromRecord(record);
            return record;
        }

        /** Registered owner plus airline name(s) from operator flag (ADSBdb /airline). */
        async function lookupRecordsFromAircraft(raw) {
            const records = [];
            const seen = new Set();
            const base = normalizeLookupRecord(raw, 'ADSBdb');
            const ownerName = base.operator.trim();

            function pushRecord(rec) {
                if (!rec.registration && !rec.operator && !rec.displayType) return;
                const key = `${rec.operator.toLowerCase()}|${rec.displayType.toLowerCase()}|${rec.registration}`;
                if (seen.has(key)) return;
                seen.add(key);
                records.push(rec);
            }

            if (ownerName || base.displayType) {
                pushRecord({ ...base, source: 'ADSBdb' });
            }

            const flag = (raw.registered_owner_operator_flag_code || raw.OperatorFlagCode || '').trim();
            if (flag) {
                try {
                    const res = await fetch(`https://api.adsbdb.com/v0/airline/${encodeURIComponent(flag)}`);
                    if (res.ok) {
                        const data = await res.json();
                        const airlines = Array.isArray(data.response) ? data.response : [];
                        for (const airline of airlines) {
                            const name = (airline.name || '').trim();
                            if (!name) continue;
                            if (ownerName && name.toLowerCase() === ownerName.toLowerCase()) continue;
                            pushRecord({ ...base, operator: name, source: 'ADSBdb' });
                        }
                    }
                } catch (err) {
                    console.warn('ADSBdb airline lookup failed:', err);
                }
            }

            return records;
        }

        async function collectLookupResults(registration) {
            const candidates = registrationLookupVariants(registration);
            const results = [];
            const seen = new Set();

            async function pushAircraft(raw) {
                for (const rec of await lookupRecordsFromAircraft(raw)) {
                    if (!rec.registration && !rec.operator && !rec.displayType) continue;
                    const key = `${rec.operator.toLowerCase()}|${rec.displayType.toLowerCase()}|${rec.registration}`;
                    if (seen.has(key)) continue;
                    seen.add(key);
                    results.push(rec);
                }
            }

            for (const reg of candidates) {
                try {
                    const res = await fetch(`https://api.adsbdb.com/v0/aircraft/${encodeURIComponent(reg)}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.response?.aircraft) await pushAircraft(data.response.aircraft);
                    }
                } catch (err) {
                    console.warn('ADSBdb lookup failed:', err);
                }
            }

            return results;
        }

        function getCurrentHistoryItem() {

            if (current) return current.closest('.history-reg-row');

        function setRowLookupStatus(historyItem, message, kind) {
            const el = historyItem?.querySelector('.history-reg-lookup-status');
            if (!el) return;
            el.textContent = message || '';
            el.classList.remove('loading', 'success', 'error', 'hidden');
            if (!message) {
                el.classList.add('hidden');
                return;
            }
            if (kind) el.classList.add(kind);
        }

        function captureRowLookupSnapshot(historyItem, lookupContext) {
            return {
                registration: historyItem.querySelector('.history-reg')?.value ?? '',
                operator: historyItem.querySelector('.history-operator')?.value ?? '',
                aircraftType: lookupContext.getTypeInput()?.value ?? ''
            };
        }

        function restoreRowLookupSnapshot(historyItem, snapshot, lookupContext) {
            const regInput = historyItem.querySelector('.history-reg');
            const operatorInput = historyItem.querySelector('.history-operator');
            if (regInput) regInput.value = snapshot.registration;
            if (operatorInput) operatorInput.value = snapshot.operator;
            const typeInput = lookupContext.getTypeInput();
            if (typeInput && snapshot.aircraftType !== undefined) {
                typeInput.value = snapshot.aircraftType;
            }

        function setUndoLookupVisible(historyItem, visible) {
            const btn = historyItem.querySelector('.undo-lookup-btn');
            if (btn) btn.classList.toggle('hidden', !visible);
        }

        function clearLookupUndo(historyItem) {
            delete historyItem._lookupUndoSnapshot;
            setUndoLookupVisible(historyItem, false);
        }

        function prepareLookupUndo(historyItem, lookupContext) {
            historyItem._lookupUndoSnapshot = captureRowLookupSnapshot(historyItem, lookupContext);
        }

        function undoRegistrationLookup(historyItem, lookupContext) {
            const snapshot = historyItem._lookupUndoSnapshot;
            if (!snapshot) return;
            restoreRowLookupSnapshot(historyItem, snapshot, lookupContext);
            clearLookupUndo(historyItem);
            hideRowLookupMatch(historyItem);
            if (activeLookupHistoryItem === historyItem) {
                hideLookupPicker(lookupContext);
                setLookupStatus(lookupContext.getStatusEl(), '', null);
            }
            setRowLookupStatus(historyItem, 'Lookup undone.', 'success');
        }

        function hideRowLookupMatch(historyItem) {
            if (!historyItem) return;
            historyItem._lookupResults = [];
            const section = historyItem.querySelector('.history-lookup-match-row');
            const picker = historyItem.querySelector('.history-lookup-match-picker');
            if (picker) picker.innerHTML = '';
            if (section) section.classList.add('hidden');
        }

        function hideLookupPicker(lookupContext) {
            activeLookupResults = [];
            if (activeLookupHistoryItem) hideRowLookupMatch(activeLookupHistoryItem);
            activeLookupHistoryItem = null;
            const pickerSection = lookupContext.getPickerSection?.();
            const picker = lookupContext.getPicker?.();
            if (picker) picker.innerHTML = '';
            if (pickerSection) pickerSection.classList.add('hidden');
        }

        function populateLookupPicker(results, lookupContext, historyItem) {
            const row = historyItem || activeLookupHistoryItem;
            activeLookupResults = results;
            activeLookupHistoryItem = row;

            const globalSection = lookupContext.getPickerSection?.();
            const globalPicker = lookupContext.getPicker?.();
            if (globalSection) globalSection.classList.add('hidden');
            if (globalPicker) globalPicker.innerHTML = '';

            const section = row?.querySelector('.history-lookup-match-row');
            const picker = row?.querySelector('.history-lookup-match-picker');
            if (!picker || !section) return;

            row._lookupResults = results;
            picker.innerHTML = '';
            results.forEach((rec, index) => {
                const opt = document.createElement('option');
                opt.value = String(index);
                const operatorLabel = rec.operator || 'Unknown operator';
                const typeLabel = rec.displayType || 'Unknown type';
                opt.textContent = `${operatorLabel} — ${typeLabel}`;
                picker.appendChild(opt);
            });
            section.classList.toggle('hidden', results.length <= 1);
        }

        function attachRowLookupMatchPicker(historyItem, lookupContext) {
            const picker = historyItem.querySelector('.history-lookup-match-picker');
            if (!picker || picker.dataset.wired === '1') return;
            picker.dataset.wired = '1';
            picker.addEventListener('change', () => {
                const results = historyItem._lookupResults;
                if (!results?.length) return;
                const record = results[parseInt(picker.value, 10)];
                if (record) applyLookupRecord(record, historyItem, lookupContext);
            });
        }

        function applyLookupRecord(record, historyItem, lookupContext) {
            if (!record) return;
            const regInput = historyItem.querySelector('.history-reg');
            const operatorInput = historyItem.querySelector('.history-operator');
            const isCurrent = historyItem.querySelector('.current-reg-checkbox')?.checked;

            if (record.registration && regInput) {
                regInput.value = record.registration;
            }
            if (operatorInput && record.operator) {
                operatorInput.value = record.operator;
            }

            if (isCurrent) {
                const typeInput = lookupContext.getTypeInput();
                if (typeInput && record.displayType) {
                    typeInput.value = record.displayType;
                }
                if (record.displayType) {
                    setRowLookupStatus(historyItem, `Found: ${record.displayType}`, 'success');
                }
            } else {
                setRowLookupStatus(historyItem, 'Operator filled for this registration.', 'success');
            }
        }

        function applySelectedLookupResult(lookupContext) {
            const picker = lookupContext.getPicker?.();
            const results = activeLookupResults;
            if (!picker || results.length === 0) return;
            const record = results[parseInt(picker.value, 10)];
            const historyItem = activeLookupHistoryItem || lookupContext.getActiveHistoryItem?.() || getCurrentHistoryItem();
            if (!historyItem || !record) return;
            applyLookupRecord(record, historyItem, lookupContext);
            setLookupStatus(lookupContext.getStatusEl(), '', null);
        }

        async function runRegistrationLookup(regInput, historyItem, lookupContext) {
            const reg = regInput.value.trim();
            if (reg.length < 3) {
                setRowLookupStatus(historyItem, 'Enter a full registration first.', 'error');
                setLookupStatus(lookupContext.getStatusEl(), '', null);
                return;
            }

            const requestId = ++registrationLookupRequestId;
            hideLookupPicker(lookupContext);
            setRowLookupStatus(historyItem, 'Looking up…', 'loading');
            setLookupStatus(lookupContext.getStatusEl(), '', null);

            const results = await collectLookupResults(reg);
            if (requestId !== registrationLookupRequestId) return;

            if (results.length === 0) {
                setRowLookupStatus(historyItem, 'Not found — enter operator and type manually.', 'error');
                return;
            }

            activeLookupHistoryItem = historyItem;
            prepareLookupUndo(historyItem, lookupContext);
            populateLookupPicker(results, lookupContext, historyItem);
            const rowPicker = historyItem.querySelector('.history-lookup-match-picker');
            if (rowPicker) rowPicker.selectedIndex = 0;
            applyLookupRecord(results[0], historyItem, lookupContext);
            setUndoLookupVisible(historyItem, true);

            if (results.length > 1) {
                setRowLookupStatus(
                    historyItem,
                    `${results.length} matches — pick operator below.`,
                    'success'
                );
                setLookupStatus(lookupContext.getStatusEl(), '', null);
            } else {
                setLookupStatus(lookupContext.getStatusEl(), '', null);
            }
        }

        function getStatus(aircraft) {
            if (aircraft.inService) return null;
            if (aircraft.status === 'Stored') return 'Stored';
            if (aircraft.status === 'Scrapped') return 'Scrapped';
            if (aircraft.status === 'Written off') return 'Written off';
            if (aircraft.status === 'Crashed') return 'Crashed';
            if (aircraft.status === 'Other' && aircraft.outOfServiceNotes) {
                return aircraft.outOfServiceNotes;
            }
            return 'Not active';
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function planespottersRegUrl(reg) {
            return `https://www.planespotters.net/search?q=${encodeURIComponent((reg || '').toUpperCase())}`;
        }

        function planespottersOperatorUrl(operator) {
            const part = (operator || '').replace(/\s+/g, '-');
            return `https://www.planespotters.net/airline/${encodeURIComponent(part)}`;
        }

        function buildRegLinkHtml(reg, className) {
            const trimmed = (reg || '').trim();
            if (!trimmed || trimmed === '—') {
                return escapeHtml(trimmed || '—');
            }
            const cls = className ? ` class="${className}"` : '';
            return `<a href="${planespottersRegUrl(trimmed)}" target="_blank" rel="noopener noreferrer"${cls}>${escapeHtml(trimmed)}</a>`;
        }

        function buildOperatorLinkHtml(operator, className) {
            const trimmed = (operator || '').trim();
            if (!trimmed || trimmed === '—' || trimmed.toLowerCase() === 'unknown') {
                return escapeHtml(trimmed || '—');
            }
            const cls = className ? ` class="${className}"` : '';
            return `<a href="${planespottersOperatorUrl(trimmed)}" target="_blank" rel="noopener noreferrer"${cls}>${escapeHtml(trimmed)}</a>`;
        }

        function getAircraftDisplayInfo(aircraft) {
            let currentReg = aircraft.registration;
            let currentOperator = aircraft.airline || 'Unknown';
            let seenItems = [];
            if (aircraft.history?.length > 0) {
                const currentInHistory = aircraft.history.find(item => item.isCurrent);
                if (currentInHistory) {
                    currentReg = currentInHistory.registration;
                    currentOperator = currentInHistory.operator || 'Unknown';
                }
                seenItems = aircraft.history.filter(item => item.isSeen);
            }
            if (aircraft.currentIsSeen) {
                const alreadyIncluded = seenItems.some(item =>
                    item.registration === aircraft.registration && item.operator === aircraft.airline
                );
                if (!alreadyIncluded) {
                    seenItems = [
                        { registration: aircraft.registration, operator: aircraft.airline },
                        ...seenItems
                    ];
                }
            }
            const operatorUrlPart = currentOperator && currentOperator !== 'Unknown'
                ? currentOperator.replace(/\s+/g, '-')
                : '';
            return { currentReg, currentOperator, seenItems, operatorUrlPart };
        }

        function normalizeRegistrationKey(reg) {
            return (reg || '').trim().toUpperCase().replace(/-/g, '');
        }

        function lookupExistingLogEntry(regKey, excludeAircraftIndex) {
            if (!regKey) return null;
            for (let i = 0; i < aircraftData.length; i++) {
                if (i === excludeAircraftIndex) continue;
                const ac = aircraftData[i];
                const keys = new Set();
                const add = (r) => {
                    const trimmed = (r || '').trim();
                    if (trimmed) keys.add(normalizeRegistrationKey(trimmed));
                };
                add(ac.registration);
                (ac.history || []).forEach(item => add(item.registration));
                if (!keys.has(regKey)) continue;
                const display = getAircraftDisplayInfo(ac);
                return {
                    index: i,
                    currentReg: display.currentReg,
                    operator: display.currentOperator
                };
            }
            return null;
        }

        function findDuplicateRegistrationsInForm(formRoot, excludeAircraftIndex) {
            const historyContainer = formRoot
                ? formRoot.querySelector('#historyItemsContainer_random')
                : historyItemsContainer;
            if (!historyContainer) return [];
            const dupes = [];
            const seenKeys = new Set();
            historyContainer.querySelectorAll('.history-reg').forEach(input => {
                const raw = input.value.trim();
                if (raw.length < 3) return;
                const key = normalizeRegistrationKey(raw);
                if (seenKeys.has(key)) return;
                seenKeys.add(key);
                const existing = lookupExistingLogEntry(key, excludeAircraftIndex);
                if (existing) {
                    dupes.push({
                        displayReg: raw.toUpperCase(),
                        existingReg: existing.currentReg,
                        operator: existing.operator
                    });
                }
            });
            return dupes;
        }

        function alertDuplicateRegistrationOnBlur(regInput, excludeAircraftIndex) {
            const raw = regInput.value.trim();
            if (raw.length < 3) return;
            const existing = lookupExistingLogEntry(normalizeRegistrationKey(raw), excludeAircraftIndex);
            if (!existing) return;
            alert(
                `${raw.toUpperCase()} is already in your log (${existing.currentReg}, ${existing.operator || 'Unknown'}). You can still save if you confirm when submitting.`
            );
        }

        function confirmDuplicateRegistrationsOverride(dupes) {
            if (!dupes.length) return true;
            const lines = dupes.map(d =>
                `${d.displayReg} — logged as ${d.existingReg} (${d.operator || 'Unknown'})`
            ).join('\n');
            return confirm(`These registrations are already in your log:\n\n${lines}\n\nSave anyway?`);
        }

        function attachRegistrationDuplicateCheck(regInput, formRoot) {
            regInput.addEventListener('blur', function() {
                let excludeIndex = -1;
                if (formRoot?.dataset?.aircraftDataIndex != null) {
                    const idx = parseInt(formRoot.dataset.aircraftDataIndex, 10);
                    if (!Number.isNaN(idx) && idx >= 0) excludeIndex = idx;
                } else {
                    const editIndex = parseInt(editIndexInput.value, 10);
                    if (editIndex >= 0) excludeIndex = editIndex;
                }
                alertDuplicateRegistrationOnBlur(this, excludeIndex);
            });
        }

        function buildAircraftSummaryHtml(aircraft, display) {
            const { currentOperator, seenItems } = display;
            const rows = [];

            rows.push(`<div class="summary-row"><dt>Current operator</dt><dd>${buildOperatorLinkHtml(currentOperator || 'Unknown')}</dd></div>`);

            const type = aircraft.type && aircraft.type !== 'Unknown type'
                ? escapeHtml(aircraft.type)
                : '—';
            rows.push(`<div class="summary-row"><dt>Aircraft type</dt><dd>${type}</dd></div>`);

            if (aircraft.flown) {
                const trips = (aircraft.trips || []).filter(t => t.departure || t.arrival || t.date);
                if (trips.length) {
                    const list = trips.map(t =>
                        `<li><span class="summary-trip-route">${escapeHtml(t.departure || '?')} → ${escapeHtml(t.arrival || '?')}</span><span class="summary-trip-date">${t.date ? formatDateDMY(t.date) : '—'}</span></li>`
                    ).join('');
                    rows.push(`<div class="summary-row"><dt>Flown</dt><dd><ul class="summary-list summary-trip-list">${list}</ul></dd></div>`);
                } else {
                    rows.push(`<div class="summary-row"><dt>Flown</dt><dd>Yes</dd></div>`);
                }
            }

            if (seenItems.length) {
                const list = seenItems.map(item =>
                    `<li>${buildRegLinkHtml(item.registration, 'summary-reg')}<span class="summary-seen-sep">·</span>${buildOperatorLinkHtml(item.operator, 'summary-airline')}</li>`
                ).join('');
                rows.push(`<div class="summary-row"><dt>Seen as</dt><dd><ul class="summary-list">${list}</ul></dd></div>`);
            }

            return `<dl class="aircraft-summary">${rows.join('')}</dl>`;
        }

        function buildRegistrationHistoryList(aircraft, mode) {
            if (mode === 'full') {
                return aircraft.history || [];
            }
            return [
                {
                    registration: aircraft.registration,
                    operator: aircraft.airline,
                    isCurrent: true,
                    isSeen: !!aircraft.currentIsSeen
                },
                ...((aircraft.history || []).filter(item =>
                    !(item.registration === aircraft.registration && item.operator === aircraft.airline)
                ))
            ];
        }

        function buildAircraftDetailsHtml(aircraft, display, options) {
            const { currentReg, currentOperator } = display;
            const sections = [];

            if (options.statusText) {
                sections.push(`<div class="detail-section"><h4 class="detail-section-title">Status</h4><p class="detail-status-text">${escapeHtml(options.statusText)}</p></div>`);
            }

            const links = [
                `<li>${buildRegLinkHtml(currentReg)}</li>`,
                `<li>${buildOperatorLinkHtml(currentOperator)}</li>`
            ];
            sections.push(`<div class="detail-section"><h4 class="detail-section-title">Links</h4><ul class="detail-list detail-list-links">${links.join('')}</ul></div>`);

            if (aircraft.sightings?.length) {
                sections.push(`<div class="detail-section"><h4 class="detail-section-title">Sightings</h4><ul class="detail-list">${aircraft.sightings.map(s =>
                    `<li><span class="detail-primary">${escapeHtml(s.location || 'Unknown location')}</span><span class="detail-meta">${s.date ? formatDateDMY(s.date) : '—'}</span></li>`
                ).join('')}</ul></div>`);
            }

            if (aircraft.flown && aircraft.trips?.length) {
                sections.push(`<div class="detail-section"><h4 class="detail-section-title">Trips flown</h4><ul class="detail-list">${aircraft.trips.map(t =>
                    `<li><span class="detail-primary">${escapeHtml(t.departure || '?')} → ${escapeHtml(t.arrival || '?')}</span><span class="detail-meta">${t.date ? formatDateDMY(t.date) : '—'}</span></li>`
                ).join('')}</ul></div>`);
            }

            const regHistory = buildRegistrationHistoryList(aircraft, options.regHistoryMode);
            if (regHistory.length) {
                sections.push(`<div class="detail-section"><h4 class="detail-section-title">Registration history</h4><ul class="detail-list detail-list-regs">${regHistory.map(item => {
                    const roles = [];
                    if (item.isCurrent) roles.push('Current');
                    if (item.isSeen) roles.push('Seen');
                    const roleStr = roles.length ? roles.join(', ') : '—';
                    const rowClass = item.isCurrent ? 'current-reg' : (item.isSeen ? 'seen-reg' : '');
                    return `<li class="${rowClass}">${buildRegLinkHtml(item.registration)}<span class="detail-meta">${buildOperatorLinkHtml(item.operator)}</span><span class="detail-role">${escapeHtml(roleStr)}</span></li>`;
                }).join('')}</ul></div>`);
            }

            return sections.join('');
        }

        function logoDevUrl(domain) {
            return 'https://img.logo.dev/' + domain + '?token=' + LOGO_DEV_TOKEN;
        }

        function getRegistrationCountry(reg) {
            if (!reg) return { prefix: '', country: '' };
            reg = String(reg).replace(/\s+/g, '');
            let prefix = '';
            let country = '';
            const map = REGISTRATION_PREFIX_TO_COUNTRY;
            if (reg.length >= 3 && map[reg.substring(0, 3)]) {
                prefix = reg.substring(0, 3);
                country = map[prefix];
            } else if (reg.length >= 2 && map[reg.substring(0, 2)]) {
                prefix = reg.substring(0, 2);
                country = map[prefix];
            } else if (map[reg.charAt(0)]) {
                prefix = reg.charAt(0);
                country = map[prefix];
            } else {
                prefix = reg.substring(0, 3);
            }
            return { prefix, country };
        }

        function getFlagUrlForRegistration(reg) {
            const { country } = getRegistrationCountry(reg);
            if (!country) return '';
            const iso = COUNTRY_NAME_TO_ISO[country];
            if (!iso) return '';
            return 'https://flagcdn.com/w80/' + iso + '.png';
        }

        function applyAirlineLogoForOperator(aircraftItem, currentOperator, registration) {
            const airline = (currentOperator || '').trim().toLowerCase();
            const reg = (registration || '').trim();
            const domain = OPERATOR_LOGO_DOMAINS[airline];
            const flagUrl = getFlagUrlForRegistration(reg);
            const countryInfo = getRegistrationCountry(reg);

            if (!domain && !flagUrl) return;

            const box = document.createElement('div');
            box.className = 'airline-logo-box';
            const boxClass = OPERATOR_LOGO_BOX[airline];
            if (domain && boxClass) box.classList.add(boxClass);

            const img = document.createElement('img');
            img.className = 'airline-logo-left';

            function showFlag() {
                box.className = 'airline-logo-box flag-logo-box';
                img.classList.add('airline-logo-flag');
                img.src = flagUrl;
                img.alt = (countryInfo.country || 'Registration country') + ' flag';
            }

            if (domain) {
                img.src = logoDevUrl(domain);
                img.alt = (currentOperator || 'Airline').trim() + ' logo';
                img.onerror = function () {
                    if (flagUrl) {
                        img.onerror = function () { box.remove(); };
                        showFlag();
                    } else {
                        box.remove();
                    }
                };
            } else {
                showFlag();
            }

            box.appendChild(img);
            aircraftItem.appendChild(box);
        }

        function appendAircraftListItem(aircraft, container, options = {}) {
            const originalIndex = aircraftData.indexOf(aircraft);
            const display = getAircraftDisplayInfo(aircraft);
            const detailsId = options.detailsId || (options.inactive ? `inactive-details-${originalIndex}` : `details-${originalIndex}`);
            const aircraftItem = document.createElement('div');
            aircraftItem.className = 'aircraft-item';
            aircraftItem.innerHTML = buildAircraftCardHtml(aircraft, originalIndex, display, {
                detailsId,
                statusText: options.inactive ? getStatus(aircraft) : null,
                regHistoryMode: options.inactive ? 'full' : 'composed'
            });
            applyAirlineLogoForOperator(aircraftItem, display.currentOperator, display.currentReg);
            attachAircraftCardListeners(aircraftItem, originalIndex, detailsId);
            container.appendChild(aircraftItem);
            return aircraftItem;
        }

                alert('You must add at least one registration.');
                return;
            }

            const hasCurrent = Array.from(document.querySelectorAll('#historyItemsContainer .current-reg-checkbox')).some(cb => cb.checked);
            if (!hasCurrent) {
                alert('You must mark one registration as Current/Last Known.');
                return;
            }

            const historyItems = [];
            let currentReg = '';
            let currentOperator = '';
            const aircraftTypeValue = (document.getElementById('aircraftType').value || '').trim();

            registrationItems.forEach(item => {
                const reg = item.querySelector('.history-reg')?.value;
                const operator = item.querySelector('.history-operator')?.value;
                const isCurrent = item.querySelector('.current-reg-checkbox').checked;
                const isSeen = item.querySelector('.seen-checkbox').checked;
                if (!reg) {
                    alert('All registrations must have a registration number.');
                    return;
                }
                if (isCurrent) {
                    currentReg = reg;
                    currentOperator = operator || 'Unknown';
                } else {
                    historyItems.push({
                        registration: reg,
                        operator: operator,
                        isCurrent: false,
                        isSeen: isSeen
                    });
                }
            });

            if (!currentReg) {
                alert('You must mark one registration as Current/Last Known.');
                return;
            }

            const editIndexForDupes = parseInt(editIndexInput.value, 10);
            const duplicateRegs = findDuplicateRegistrationsInForm(null, editIndexForDupes >= 0 ? editIndexForDupes : -1);
            if (!confirmDuplicateRegistrationsOverride(duplicateRegs)) {
                return;
            }

            let status = null;
            let statusNotes = null;
            if (!inServiceCheckbox.checked) {
                if (statusStored.checked) status = 'Stored';
                else if (statusScrapped.checked) status = 'Scrapped';
                else if (statusWrittenOff.checked) status = 'Written off';
                else if (statusCrashed.checked) status = 'Crashed';
                else if (statusOther.checked) {
                    status = 'Other';
                    statusNotes = outOfServiceNotes.value;
                }
            }

            let trips = [];
            if (flownCheckbox.checked) {
                document.querySelectorAll('#tripsContainer .history-item').forEach(item => {
                    const departure = item.querySelector('.trip-departure').value;
                    const arrival = item.querySelector('.trip-arrival').value;
                    const date = item.querySelector('.trip-date').value;
                    if (departure || arrival || date) {
                        trips.push({ departure, arrival, date });
                    }
                });
            }

            let sightings = [];
            document.querySelectorAll('#sightingsContainer .history-item').forEach(item => {
                const location = item.querySelector('.sighting-location').value;
                const date = item.querySelector('.sighting-date').value;
                if (location || date) {
                    sightings.push({ location, date });
                }
            });

            const currentRow = Array.from(registrationItems).find(item => item.querySelector('.current-reg-checkbox').checked);
            const currentIsSeen = currentRow ? currentRow.querySelector('.seen-checkbox').checked : false;

            const aircraft = {
                registration: currentReg,
                airline: currentOperator,
                type: aircraftTypeValue,
                inService: inServiceCheckbox.checked,
                status: status,
                outOfServiceNotes: statusNotes,
                history: historyItems,
                currentIsSeen: currentIsSeen,
                flown: flownCheckbox.checked,
                trips: trips,
                sightings: sightings,
                loggedDate: new Date().toISOString()
            };

            const editIndex = parseInt(editIndexInput.value, 10);
            if (editIndex >= 0) {
                aircraftData[editIndex] = aircraft;
            } else {
                aircraftData.push(aircraft);
            }
            saveAircraftData();
            alert('Aircraft saved successfully!');
            showLandingPage();
        }

        function logSearchMatchesFields(searchVal, registration, operator) {
            const reg = (registration || '').toLowerCase();
            const op = (operator || '').toLowerCase();
            return reg.includes(searchVal) || op.includes(searchVal);
        }

        /** Registrations and operators that are not the aircraft's current pair. */
        function getHistoricLogSearchValues(aircraft) {
            const { currentReg, currentOperator } = getAircraftDisplayInfo(aircraft);
            const curReg = (currentReg || '').trim().toLowerCase();
            const curOp = (currentOperator || '').trim().toLowerCase();
            const values = new Set();

            const addReg = (reg) => {
                const r = (reg || '').trim();
                if (!r) return;
                const lower = r.toLowerCase();
                if (lower !== curReg) values.add(lower);
            };
            const addOp = (op) => {
                const o = (op || '').trim();
                if (!o) return;
                const lower = o.toLowerCase();
                if (lower !== curOp) values.add(lower);
            };

            if (Array.isArray(aircraft.history)) {
                aircraft.history.forEach(item => {
                    if (item.isCurrent) return;
                    addReg(item.registration);
                    addOp(item.operator);
                });
            }
            addReg(aircraft.registration);
            addOp(aircraft.airline);

            return values;
        }

        function aircraftMatchesLogSearch(aircraft, searchVal, scope) {
            const { currentReg, currentOperator } = getAircraftDisplayInfo(aircraft);
            const matchesCurrent = logSearchMatchesFields(searchVal, currentReg, currentOperator);
            const matchesHistoric = [...getHistoricLogSearchValues(aircraft)].some(v => v.includes(searchVal));

            if (scope === 'current') return matchesCurrent;
            if (scope === 'historic') return matchesHistoric;
            return matchesCurrent || matchesHistoric;
        }

        function displayAircraftList() {
            aircraftEntries.innerHTML = '';
            let activeAircraft = aircraftData.filter(aircraft => aircraft.inService);
            const flownOnlyCheckbox = document.getElementById('flownOnlyFilter');
            if (flownOnlyCheckbox && flownOnlyCheckbox.checked) {
                activeAircraft = activeAircraft.filter(aircraft => aircraft.flown);
            }
            const registrationSearch = document.getElementById('registrationSearch');
            if (registrationSearch && registrationSearch.value.trim() !== '') {
                const searchVal = registrationSearch.value.trim().toLowerCase();
                const scopeEl = document.querySelector('input[name="logSearchScope"]:checked');
                const scope = scopeEl ? scopeEl.value : 'all';
                activeAircraft = activeAircraft.filter(aircraft =>
                    aircraftMatchesLogSearch(aircraft, searchVal, scope)
                );
            }
            const sortBy = sortFilter.value;
            if (sortBy === 'airline') {
                const allOperators = new Set();
                activeAircraft.forEach(aircraft => {
                    if (aircraft.airline) allOperators.add(aircraft.airline);
                });
                const sortedOperators = Array.from(allOperators).sort((a, b) => a.localeCompare(b));
                sortedOperators.forEach(operator => {
                    const groupAircraft = activeAircraft.filter(aircraft => aircraft.airline === operator)
                        .sort((a, b) => (a.registration || '').localeCompare(b.registration || ''));
                    if (groupAircraft.length > 0) {
                        const heading = document.createElement('h3');
                        heading.className = 'list-group-heading';
                        heading.textContent = operator;
                        aircraftEntries.appendChild(heading);
                        groupAircraft.forEach(aircraft => {
                            appendAircraftListItem(aircraft, aircraftEntries);
                        });
                    }
                });
                return;
            } else {
                // Group by registration prefix
                function getPrefixAndCountry(reg) {
                    return getRegistrationCountry(reg);
                }
                // Group aircraft by prefix
                const groupMap = {};
                activeAircraft.forEach(aircraft => {
                    let reg = aircraft.registration || '';
                    const {prefix, country} = getPrefixAndCountry(reg);
                    const groupKey = country ? `${prefix} ${country}` : prefix;
                    if (!groupMap[groupKey]) groupMap[groupKey] = [];
                    groupMap[groupKey].push(aircraft);
                });
                const sortedGroups = Object.keys(groupMap).sort();
                sortedGroups.forEach(groupKey => {
                    const heading = document.createElement('h3');
                    heading.className = 'list-group-heading';
                    heading.textContent = groupKey;
                    aircraftEntries.appendChild(heading);
                    // Sort aircraft by registration alphabetically within each operator
                    groupMap[groupKey].sort((a, b) => (a.registration || '').localeCompare(b.registration || ''));
                    groupMap[groupKey].forEach(aircraft => {
                        appendAircraftListItem(aircraft, aircraftEntries);
                    });
                });
                return;
            }
            if (activeAircraft.length === 0) {
                aircraftEntries.innerHTML = '<p class="empty-state">No active aircraft logged yet.</p>';
                return;
            }
            // Grouping logic
            let lastGroup = null;
            activeAircraft.forEach((aircraft, index) => {
                let groupKey = '';
                if (sortBy === 'airline') {
                    groupKey = aircraft.airline || 'Unknown';
                } else {
                    // Use first two letters + '-' as prefix
                    groupKey = (aircraft.registration || '').substring(0, 2).toUpperCase() + '-';
                }
                if (groupKey !== lastGroup) {
                    const heading = document.createElement('h3');
                    heading.className = 'list-group-heading';
                    heading.textContent = groupKey;
                    aircraftEntries.appendChild(heading);
                    lastGroup = groupKey;
                }
                appendAircraftListItem(aircraft, aircraftEntries);
            });
        }
        
        function displayInactiveAircraftList() {
            inactiveAircraftEntries.innerHTML = '';
            
            let inactiveAircraft = aircraftData.filter(aircraft => !aircraft.inService);
            // Registration search filter for inactive
            const inactiveRegistrationSearch = document.getElementById('inactiveRegistrationSearch');

                const searchVal = inactiveRegistrationSearch.value.trim().toLowerCase();
                inactiveAircraft = inactiveAircraft.filter(aircraft => {

                    if ((aircraft.registration || '').toLowerCase().includes(searchVal)) return true;
                    // Check all history registrations
                    if (Array.isArray(aircraft.history)) {
                        return aircraft.history.some(item => (item.registration || '').toLowerCase().includes(searchVal));
                    }
                    return false;
                });
            }
            if (inactiveAircraft.length === 0) {
                inactiveAircraftEntries.innerHTML = '<p class="empty-state">No inactive aircraft logged yet.</p>';
                return;
            }
            function getPrefixAndCountry(reg) {
                return getRegistrationCountry(reg);
            }
            // Group by prefix, then by airline
            const groupMap = {};
            inactiveAircraft.forEach(aircraft => {
                let reg = aircraft.registration || '';
                const {prefix, country} = getPrefixAndCountry(reg);
                const groupKey = country ? `${prefix} ${country}` : prefix;
                if (!groupMap[groupKey]) groupMap[groupKey] = {};
                const airline = aircraft.airline || 'Unknown';
                if (!groupMap[groupKey][airline]) groupMap[groupKey][airline] = [];

        function exportData() {
            const dataStr = JSON.stringify(aircraftData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'aircraft_log.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        function handleImportFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (!Array.isArray(importedData)) throw new Error('Invalid data format');
                    aircraftData = importedData;
                    saveAircraftData();
                    alert('Data imported successfully!');
                    showLandingPage();
                } catch (err) {
                    alert('Failed to import data: ' + err.message);
                }
            };
            reader.readAsText(file);
            // Reset the input so the same file can be imported again if needed
            e.target.value = '';
        }
        
        // ========== RANDOM REVIEW FUNCTIONS ==========
        let randomReviewOrder = [];
        let randomReviewIndex = 0;
        function startRandomReview() {
            // Only include aircraft that are in service, stored, or marked as 'Other', but NOT scrapped
            const eligibleAircraft = aircraftData.filter(aircraft => {
                if (aircraft.inService) return true;
                if (aircraft.status === 'Stored') return true;
                if (aircraft.status === 'Other') return true;
                return false; // Exclude scrapped and any others
            });
            if (!eligibleAircraft.length) {
                alert('No eligible aircraft in your log to review!');
                return;
            }
            // Shuffle indices for random order
            randomReviewOrder = eligibleAircraft.map((_, i) => i);
            for (let i = randomReviewOrder.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [randomReviewOrder[i], randomReviewOrder[j]] = [randomReviewOrder[j], randomReviewOrder[i]];
            }
            randomReviewIndex = 0;
            // Store eligible aircraft for this session
            window._randomReviewEligibleAircraft = eligibleAircraft;
            showRandomReviewPage();
            showRandomAircraftForReview();
        }
        function showRandomReviewPage() {
            landingPage.classList.add('hidden');

            randomReviewPage.classList.remove('hidden');

            const eligibleAircraft = window._randomReviewEligibleAircraft;
            if (randomReviewIndex >= randomReviewOrder.length) {
                alert('All aircraft reviewed! Returning to home.');
                exitRandomReview();
                return;
            }
            const idx = randomReviewOrder[randomReviewIndex];
            // Render the edit form for this aircraft inside randomReviewFormContainer
            renderEditFormInContainer(idx, randomReviewFormContainer, eligibleAircraft);

        // Helper to render the edit form for a given aircraft index inside a container

        // Save the random review form data back to aircraftData

                wrapper,
                !Number.isNaN(excludeIndex) && excludeIndex >= 0 ? excludeIndex : -1
            );

            let status = null;

                    status = 'Crashed';

                    status = 'Other';

                    const departure = item.querySelector('.trip-departure').value;
